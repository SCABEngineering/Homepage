<style>

   sub-pages with left LNB + body. Responsive via container queries. Tone switched by data-tone (default: Grid Navy · Teal) */
:root{
  --ac:#007A85; --ac-strong:#005E66; --ac-soft:#E2F2F3; --ac-hl:#3CC8D2; --ac-btn:#007A85; --ac-btn-h:#00636C; --ac-ink:#FFFFFF; --err:#C8102E;
  --sw-on:#D7263D; --ink:#16202A; --title:#3B4754; --muted:#5F6B77; --faint:#94A0AB; --bg:#FFFFFF; --panel:#F2F5F7; --panel-2:#E4E9EE;
  --line:#DCE2E8; --card:#FFFFFF; --well:#FFFFFF; --tile:#FFFFFF; --th:#13253A; --th-fg:#FFFFFF; --hero:#0D1B2A; --hero-2:#13253A; --hero-fg:#F2F6FA;
  --hero-muted:#9FB0C2; --hero-line:#26394F; --hero-grid:rgba(160,200,230,.05); --ok:#1E9E57; --open:#16A34A; --warn:#D08A00;
  --scrim:rgba(8,16,26,.55); --shadow:0 14px 36px rgba(13,27,42,.12); --logo-l:block; --logo-d:none;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --maxw:1360px; --gut:32px; --hdr:72px;
}

    --title:#C8C8CE; --muted:#A3A3AB; --faint:#74747B; --panel:#18181B; --panel-2:#0A0A0B; --line:#2C2C31; --th:#2A2A2F; --bg:#111113;
    --card:#17171A; --hero:#0B0B0C; --hero-2:#19191C; --hero-fg:#F4F4F5; --hero-muted:#A9A9B0; --hero-line:#323237; --hero-grid:transparent;

  --title:#C8C8CE; --muted:#A3A3AB; --faint:#74747B; --panel:#18181B; --panel-2:#0A0A0B; --line:#2C2C31; --th:#2A2A2F; --bg:#111113; --card:#17171A;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
img{display:block}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.mono{font-family:var(--mono)}
.ic{display:inline-flex;flex:none}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm svg{width:16px;height:16px}
.ic.lg svg{width:26px;height:26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.email{overflow-wrap:anywhere;word-break:break-all}

/* stage + preview */
.stage{min-height:100%;transition:background .2s}
.stage.preview{background:var(--panel-2);padding-block:28px 120px}
.stage.preview .site{max-width:var(--pw);margin-inline:auto;border-radius:20px;box-shadow:var(--shadow);overflow:clip;outline:1px solid var(--line)}
.site{container:site/inline-size;background:var(--bg);position:relative;min-height:100vh}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding-inline:22px;font-weight:600;font-size:15px;border-radius:2px;border:1px solid transparent;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn.pri{background:var(--ac-btn);color:var(--ac-ink)}
.btn.pri:hover{background:var(--ac-btn-h)}
.btn.line{border-color:var(--line);background:var(--card);color:var(--ink)}
.btn.line:hover{border-color:var(--ink)}
.btn.ghost{border-color:rgba(255,255,255,.4);color:#fff}
.btn.ghost:hover{border-color:#fff;background:rgba(255,255,255,.06)}
.btn.sm{height:36px;padding-inline:14px;font-size:14px}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ac);font-size:15px}
.link:hover{gap:10px}
.link .ic svg{width:18px;height:18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:500}
.on-dark.eyebrow{color:var(--ac-hl)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding-inline:10px;border-radius:13px;background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--bc,var(--ac))}
.chip.red{background:var(--ac-soft);color:var(--ac)}
.chip.sample{background:transparent;border:1px dashed var(--faint);color:var(--muted);height:22px;font-size:11.5px}
.draft{display:inline-flex;align-items:center;height:22px;padding-inline:8px;border:1px dashed var(--err);color:var(--err);font-size:11.5px;border-radius:3px;font-weight:600;vertical-align:middle}

/* utility bar */
.util{background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.util-in{display:flex;justify-content:space-between;align-items:center;min-height:36px;gap:16px}
.util-tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.util-links{display:flex;align-items:center;gap:18px}
.util-links a:hover{color:var(--ink)}
.util-tel{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.lang button{padding:2px 9px;font-size:11.5px;font-family:var(--mono)}
.lang button.on{background:var(--ink);color:var(--bg)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line);border-radius:2px;font-size:12px}
.theme-btn:hover{border-color:var(--ink);color:var(--ink)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;height:var(--hdr);gap:28px}
.logo{display:flex;align-items:center;flex:none}
.logo img{height:40px;width:auto}
.logo .l{display:var(--logo-l)} .logo .d{display:var(--logo-d)}
.gnb{flex:1;display:flex;justify-content:center}
.gnb>ul{display:flex}
.gnb-a{position:relative;display:flex;align-items:center;height:var(--hdr);padding-inline:22px;font-weight:600;font-size:16.5px;color:var(--ink)}
.gnb-a::after{content:"";position:absolute;left:22px;right:22px;bottom:-1px;height:3px;background:var(--ac);transform:scaleX(0);transition:transform .2s}
.gnb li.open .gnb-a::after,.gnb li.cur .gnb-a::after{transform:scaleX(1)}
.gnb li.cur .gnb-a{color:var(--ac)}
.hdr-act{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;color:var(--ink)}
.icon-btn:hover{background:var(--panel)}
.burger{display:none}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.mega-in{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:40px;padding-block:32px 36px}
.mega-intro h3{font-size:24px;color:var(--title);margin-block:8px 10px}
.mega-intro p{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.mega-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px;border-left:1px solid var(--line);padding-left:36px}
.mega-col h4{font-size:12px;font-family:var(--mono);letter-spacing:.12em;color:var(--faint);text-transform:uppercase;font-weight:500;margin-bottom:10px}
.mega-col a{display:flex;align-items:center;justify-content:space-between;padding-block:7px;font-size:15px;color:var(--ink);border-bottom:1px solid transparent}
.mega-col a:hover{color:var(--ac)}
.mega-col a .ic{opacity:0;transition:opacity .15s}
.mega-col a:hover .ic{opacity:1}
.mega-feat{display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid var(--line)}
.mega-feat .fimg{height:140px;background:var(--well);display:grid;place-items:center;padding:14px}
.mega-feat .fimg img{max-height:112px;width:auto;max-width:100%;object-fit:contain}
.mega-feat .fimg.txt{background:var(--hero);color:var(--hero-fg);font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.02em}
.mega-feat .fb{padding:14px 16px}
.mega-feat .fb b{display:block;font-size:15px}
.mega-feat .fb span{font-size:13.5px;color:var(--muted)}
.mega-feat:hover b{color:var(--ac)}
.drawer{border-top:1px solid var(--line);background:var(--bg);max-height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));overflow:auto}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:600;font-size:17px;cursor:pointer}
.drawer summary::-webkit-details-marker{display:none}
.drawer summary .ic{transition:transform .2s}
.drawer details[open] summary .ic{transform:rotate(90deg)}
.drawer .dl{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;padding-bottom:16px}
.drawer .dl a{padding:8px 0;color:var(--muted);font-size:15px}
.drawer .dl a.cur{color:var(--ac);font-weight:600}
.drawer-foot{display:flex;gap:10px;padding-block:18px 24px;flex-wrap:wrap}

/* hero */
.hero{position:relative;background-color:var(--hero);color:var(--hero-fg);overflow:hidden}
.hero,.phero,.sec.dark{background-image:linear-gradient(var(--hero-grid) 1px,transparent 1px),linear-gradient(90deg,var(--hero-grid) 1px,transparent 1px);background-size:56px 56px}
.hero-cube{position:absolute;right:-90px;top:50%;transform:translateY(-50%);width:600px;max-width:none;opacity:.055;pointer-events:none}
.slides{display:grid}
.slide{grid-area:1/1;display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:48px;align-items:center;padding-block:76px 144px;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.slide.on{opacity:1;visibility:visible}
.slide h1{font-size:46px;line-height:1.22;font-weight:700;margin-block:14px 18px}
.slide-p{color:var(--hero-muted);font-size:17px;max-width:46ch}
.slide-cta{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.bchips span{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:2px;color:#fff;background:var(--bc)}
.slide-vis{position:relative;min-width:0}
.collage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;height:440px}
.collage .ph{position:relative;background:#fff;border-radius:3px;overflow:hidden;min-width:0;min-height:0;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.collage .ph img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain}
.collage .ph.big{grid-row:span 2}
.collage .ph figcaption{font-family:var(--mono);font-size:11px;color:#56565C;letter-spacing:.06em;margin-top:8px;text-align:center}
.vis-card{background:var(--hero-2);border:1px solid var(--hero-line);border-radius:4px;padding:18px 20px 14px}
.vis-card .vc-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--hero-muted);letter-spacing:.08em;margin-bottom:6px;gap:12px}
.vis-cap{font-size:13.5px;color:var(--hero-muted);margin-top:6px;min-height:2.6em}
.hero-ctrl{position:absolute;left:0;right:0;bottom:78px}
.hero-ctrl .wrap{display:flex;align-items:center;gap:18px}
.hc-count{font-family:var(--mono);font-size:13px;color:var(--hero-muted);white-space:nowrap}
.hc-count b{color:#fff;font-weight:500}
.hc-bars{display:flex;gap:6px;flex:0 1 auto;min-width:0}
.hc-bars button{width:44px;height:14px;position:relative;flex:0 1 44px;min-width:10px}
.hc-bars button::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:rgba(255,255,255,.22)}
.hc-bars button::after{content:"";position:absolute;left:0;top:6px;height:2px;width:0;background:var(--ac-hl)}
.hc-bars button.on::after{width:100%;transition:width var(--dur,7s) linear}
.hc-bars.paused button.on::after{transition:none;width:100%}
.hc-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);border-radius:50%;color:#fff}
.hc-btn:hover{border-color:#fff}
.hc-btn .ic svg{width:16px;height:16px}

/* quick */
.quick{position:relative;z-index:2;margin-top:-44px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:22px 24px;border-right:1px solid var(--line);transition:background .15s}
.q:last-child{border-right:0}
.q>.ic{grid-row:span 2;width:46px;height:46px;border-radius:50%;background:var(--ac-soft);color:var(--ac);align-items:center;justify-content:center}
.q b{font-size:16.5px}
.q span.d{font-size:13.5px;color:var(--muted);grid-column:2}
.q .go{grid-row:1/span 2;grid-column:3;color:var(--faint)}
.q:hover{background:var(--panel)}
.q:hover .go{color:var(--ac)}

/* sections */
.sec{padding-block:96px}
.sec.tight{padding-block:72px}
.sec.alt{background:var(--panel)}
.sec.dark{background-color:var(--hero-2);color:var(--hero-fg)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;margin-bottom:40px;flex-wrap:wrap}
.sec-head .lead{margin-top:14px}
.t2{position:relative;padding-top:20px;font-size:32px;line-height:1.3;font-weight:700;color:var(--title)}
.t2::before{content:"";position:absolute;left:0;top:0;width:36px;height:4px;background:var(--ac)}
.sec.dark .t2{color:#fff}
.t3{font-size:21px;font-weight:700;color:var(--title);line-height:1.4}
.lead{color:var(--muted);font-size:17px;max-width:64ch}
.sec.dark .lead{color:var(--hero-muted)}

/* brands */
.brand-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.brand{display:grid;grid-template-rows:96px auto 1fr auto;background:var(--card);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.brand:hover{border-color:var(--ink)}
.brand .bl{background:var(--tile);display:grid;place-items:center;padding:20px;border-bottom:3px solid var(--bc)}
.brand .bl img{max-height:46px;max-width:78%;width:auto;object-fit:contain}
.txtlogo{font-weight:700;font-size:22px;letter-spacing:.04em;color:#1565C0;display:flex;align-items:baseline;gap:8px}
.txtlogo small{font-size:15px;letter-spacing:0;font-weight:600}
.brand .bt{padding:18px 18px 4px;font-weight:700;font-size:16px}
.brand .bd{padding:0 18px 14px;font-size:13.5px;color:var(--muted)}
.brand .bf{padding:12px 18px;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ac);display:flex;justify-content:space-between;align-items:center}

/* solutions */
.sol-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.sol{display:grid;grid-template-rows:auto 1fr;background:var(--card);border:1px solid var(--line);transition:border-color .15s}
.sol:hover{border-color:var(--ink)}
.sol .sv{background:var(--panel);padding:14px 14px 6px;border-bottom:1px solid var(--line);aspect-ratio:16/10;display:grid;place-items:center}
.sol .sv svg{width:100%;height:100%}
.sol .sb{padding:20px 20px 22px;display:grid;gap:8px;align-content:start}
.sol .sb .eyebrow{font-size:11px}
.sol .sb b{font-size:18px;line-height:1.4}
.sol .sb p{font-size:14px;color:var(--muted)}
.sol .sb .link{margin-top:6px}

/* engineering band */
.eng{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:56px;align-items:start}
.svc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hero-line);border:1px solid var(--hero-line)}
.svc{background:var(--hero-2);padding:18px 20px}
.svc b{display:block;font-size:15.5px;margin-bottom:4px}
.svc span{font-size:13.5px;color:var(--hero-muted)}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:44px;counter-reset:st}
.step{position:relative;background:var(--hero);border:1px solid var(--hero-line);padding:16px 16px 18px;counter-increment:st;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.step::before{content:counter(st,decimal-leading-zero);display:block;font-family:var(--mono);font-size:12px;color:var(--ac-hl);margin-bottom:6px}
.step b{font-size:14.5px;line-height:1.4;display:block}
.step.hl{background:var(--ac-btn);border-color:var(--ac-btn);color:var(--ac-ink)}
.step.hl::before{color:var(--ac-ink)}
.steps.light .step{background:var(--card);border-color:var(--line);color:var(--ink)}
.steps.light .step::before{color:var(--ac)}
.steps.light .step.hl{background:var(--ac-btn);border-color:var(--ac-btn);color:var(--ac-ink)}
.steps.light .step.hl::before{color:var(--ac-ink)}

/* references */
.ref-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ref-col{background:var(--card);border:1px solid var(--line)}
.ref-col h3{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);font-size:17px;color:var(--title)}
.ref-col li{display:grid;gap:2px;padding:14px 20px;border-bottom:1px solid var(--line)}
.ref-col li:last-child{border-bottom:0}
.ref-col li b{font-size:15px;font-weight:600}
.ref-col li span{font-size:13px;color:var(--muted)}
.marquee{margin-top:40px;overflow:hidden;border-block:1px solid var(--line);background:var(--tile);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq-track{display:flex;gap:44px;width:max-content;padding-block:20px;animation:mq 60s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
.mq-track img{height:40px;width:auto;max-width:150px;object-fit:contain}
@keyframes mq{to{transform:translateX(-50%)}}
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.logo-grid div{background:var(--tile);height:84px;display:grid;place-items:center;padding:14px}
.logo-grid img{max-height:44px;max-width:100%;width:auto;object-fit:contain}

/* news + cta */
.news-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px}
.news-list{border-top:2px solid var(--ink)}
.news-list a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:17px 4px;border-bottom:1px solid var(--line)}
.news-list a:hover b{color:var(--ac)}
.news-list b{font-weight:500;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-list time{font-family:var(--mono);font-size:13px;color:var(--faint)}
.cta-card{background:var(--hero);color:var(--hero-fg);padding:28px;display:grid;gap:14px;align-content:start;position:relative;overflow:hidden}
.cta-card .big{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:.01em}
.cta-card p{color:var(--hero-muted);font-size:14px}
.cta-card img{position:absolute;right:-40px;bottom:-50px;width:200px;opacity:.07}

/* footer */
.ftr{background:var(--hero);color:var(--hero-muted);font-size:13.5px}
.ftr-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:48px;padding-block:56px 36px;border-bottom:1px solid var(--hero-line)}
.ftr-top img{height:36px;width:auto;margin-bottom:18px}
.ftr-info{display:grid;gap:4px}
.ftr-info span b{color:var(--hero-fg);font-weight:500;margin-right:6px}
.ftr-map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.ftr-map h4{color:#fff;font-size:14px;margin-bottom:10px}
.ftr-map a{display:block;padding-block:3px}
.ftr-map a:hover{color:#fff}
.ftr-bot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px 28px;flex-wrap:wrap}
.ftr-bot nav{display:flex;gap:18px;flex-wrap:wrap}
.ftr-bot nav button:hover{color:#fff}
.ftr-bot nav button.b{color:#fff;font-weight:600}
.fam{background:var(--hero-2);border:1px solid var(--hero-line);color:var(--hero-fg);height:34px;padding-inline:10px;font-size:13px}

/* sub pages */
.phero{position:relative;background-color:var(--hero);color:var(--hero-fg);overflow:hidden}
.phero .wrap{padding-block:52px 46px;position:relative}
.phero-cube{position:absolute;right:4%;top:-40px;width:300px;opacity:.06;pointer-events:none}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--hero-muted);margin-bottom:18px;flex-wrap:wrap}
.crumb a:hover{color:#fff}
.phero h1{font-size:38px;font-weight:700;margin-top:8px}
.phero p.pd{color:var(--hero-muted);margin-top:10px;max-width:64ch}
.sub{display:grid;grid-template-columns:232px minmax(0,1fr);gap:56px;padding-block:56px 104px}
.lnb{position:sticky;top:calc(var(--hdr) + 24px + env(safe-area-inset-top,0px));align-self:start}
.lnb-t{font-size:20px;font-weight:700;padding-bottom:14px;border-bottom:2px solid var(--ink);color:var(--title)}
.lnb h5{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;font-weight:500;margin:18px 0 4px}
.lnb a{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px;color:var(--muted)}
.lnb a:hover{color:var(--ink)}
.lnb a.cur{color:var(--ac);font-weight:600}
.lnb a .ic{opacity:0}
.lnb a.cur .ic{opacity:1}
.sub-body{min-width:0;display:grid;gap:56px;align-content:start}
.block{display:grid;gap:22px;align-content:start}
.block-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.note{font-size:13px;color:var(--faint)}
.prose{font-size:16.5px;line-height:1.85;color:var(--ink);max-width:68ch;display:grid;gap:14px}
.sign{font-weight:600;color:var(--title)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--th);color:var(--th-fg);font-weight:600;font-size:13.5px;white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody tr:hover td{background:var(--panel)}
.info th{width:170px;background:var(--panel);color:var(--title);font-weight:600;white-space:nowrap}
.info td{color:var(--ink)}
.tnum{font-variant-numeric:tabular-nums}
td.hl{color:var(--ac);font-weight:600}

/* cards general */
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);padding:22px}
.card h4{font-size:16.5px;margin-bottom:6px;color:var(--ink)}
.card p{font-size:14px;color:var(--muted)}
.card .ix{font-family:var(--mono);font-size:12px;color:var(--ac);margin-bottom:10px;display:block}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--card)}
.fact{padding:22px 22px 20px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ac);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.fact span{font-size:14px;color:var(--muted)}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rs{padding:20px 30px 22px 22px;background:var(--panel);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);display:grid;gap:6px;align-content:start}
.rs .yr{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rs b{font-size:17px;line-height:1.4}
.rs p{font-size:13.5px;color:var(--muted)}
.rs.now{background:var(--ac-btn);color:var(--ac-ink)}
.rs.now .yr,.rs.now p{color:var(--ac-ink);opacity:.85}
.rs.fut{background:var(--hero);color:var(--hero-fg)}
.rs.fut .yr,.rs.fut p{color:var(--hero-muted)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 16px;position:relative;overflow:clip}
.tl-i{position:relative;padding-top:26px}
.tl-i::before{content:"";position:absolute;left:0;right:-16px;top:7px;height:2px;background:var(--line)}
.tl-i::after{content:"";position:absolute;left:0;top:1px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--faint)}
.tl-i.hl::after{border-color:var(--ac);background:var(--ac)}
.tl-i .yr{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--title);margin-bottom:8px;font-variant-numeric:tabular-nums}
.tl-i.hl .yr{color:var(--ac)}
.tl-i li{position:relative;padding-left:12px;font-size:14px;color:var(--muted);margin-bottom:6px;line-height:1.55}
.tl-i li::before{content:"";position:absolute;left:0;top:.7em;width:4px;height:4px;background:var(--faint)}
.tl-next{display:flex;gap:12px;align-items:center;background:var(--panel);padding:16px 20px;border-left:4px solid var(--ac);font-size:15px}
.tl-next b{color:var(--ac);font-family:var(--mono)}

/* org */
.org-brands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ob{background:var(--card);border:1px solid var(--line);display:grid;grid-template-rows:72px auto}
.ob .bl{background:var(--tile);display:grid;place-items:center;padding:14px;border-bottom:3px solid var(--bc)}
.ob .bl img{max-height:36px;max-width:80%;width:auto}
.ob .bl .txtlogo{font-size:18px}
.ob p{padding:12px 14px;font-size:13px;color:var(--muted);text-align:center}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pil{padding:22px;border:1px solid var(--line);background:var(--card)}
.pil.k{background:var(--hero);color:var(--hero-fg);border-color:var(--hero)}
.pil h4{font-size:17px;margin-bottom:12px}
.pil li{position:relative;padding-left:14px;font-size:14px;margin-bottom:7px;color:var(--muted)}
.pil.k li{color:var(--hero-muted)}
.pil li::before{content:"";position:absolute;left:0;top:.66em;width:5px;height:5px;background:var(--ac)}

/* certs */
.cert-row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
.cert{background:var(--card);border:1px solid var(--line);padding:12px;display:grid;gap:10px;text-align:center}
.cert .ci{background:var(--well);aspect-ratio:3/4;max-width:100%;position:relative;overflow:hidden}
.cert .ci img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cert span{font-size:13.5px;font-weight:600}
.cert:hover span{color:var(--ac)}
.dist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dc{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center;border:1px solid var(--line);background:var(--card);padding:12px}
.dc .bl{background:var(--tile);height:60px;display:grid;place-items:center;padding:8px}
.dc .bl img{max-height:32px;width:auto;max-width:100%}
.dc .bl{overflow:hidden}.dc .bl .txtlogo{font-size:14px;white-space:nowrap}
.dc .bl.k{background:var(--hero);color:#fff;font-weight:700;font-size:17px;letter-spacing:.04em}
.dc b{display:block;font-size:14.5px}
.dc span{font-size:13px;color:var(--muted)}

/* tabs, filters */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button,.tabs a{padding:12px 18px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs .on{color:var(--ac);border-bottom-color:var(--ac)}
.tabs button:hover,.tabs a:hover{color:var(--ink)}
.fbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:36px;padding-inline:14px;border:1px solid var(--line);border-radius:18px;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:var(--card)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--bc)}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;height:42px;border:1px solid var(--line);background:var(--card);padding-inline:12px;min-width:0;flex:0 1 300px}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;height:100%;font-size:14.5px}
.search:focus-within{border-color:var(--ink)}
.count{font-size:14px;color:var(--muted)}
.count b{color:var(--ac);font-family:var(--mono)}

/* products */
.bhead{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;border:1px solid var(--line);background:var(--card)}
.bhead .bl{background:var(--tile);display:grid;place-items:center;padding:24px;border-right:4px solid var(--bc)}
.bhead .bl img{max-height:58px;max-width:85%;width:auto}
.bhead .bi{padding:22px 24px 22px 0;display:grid;gap:10px;align-content:start}
.bhead .bi h3{font-size:22px;color:var(--title)}
.bhead .bi>.chip{justify-self:start}
.bhead .bi p{color:var(--muted);font-size:15px}
.made{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted)}
.made span b{font-family:var(--mono);color:var(--ink);font-weight:500;margin-left:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px}
.pc{display:grid;grid-template-rows:auto 1fr auto;background:var(--card);border:1px solid var(--line);transition:border-color .15s;text-align:left}
.pc:hover{border-color:var(--ink)}
.pc{min-width:0}
.pc .pw{background:var(--well);aspect-ratio:4/3;max-width:100%;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.pc .pw img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain}
.pc .pw .plate{position:absolute;inset:0}
.pc .pb{padding:16px 18px 6px;display:grid;gap:6px;align-content:start}
.pc .pm{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.01em}
.pc .pn{font-weight:700;font-size:16.5px;line-height:1.4}
.pc ul li{position:relative;padding-left:12px;font-size:13.5px;color:var(--muted);line-height:1.55}
.pc ul li::before{content:"";position:absolute;left:0;top:.66em;width:4px;height:4px;background:var(--ac)}
.pc .pf{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 16px;gap:8px}
.pc .pf .link{font-size:14px}
.pc .bdg{position:absolute;left:10px;top:10px}
.plate{width:100%;height:100%;display:grid;align-content:center;justify-items:center;gap:10px;background:linear-gradient(180deg,var(--bc) 0 6px,#F4F4F5 6px);color:#2A2A2E;text-align:center;padding:12px}
.plate .pl-b{font-weight:700;font-size:15px;color:var(--bc);letter-spacing:.03em}
.plate .pl-m{font-family:var(--mono);font-size:13px;color:#4A4A50}
.plate svg{width:72%;height:auto}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

/* solution detail */
.sd-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.diagram{background:var(--panel);border:1px solid var(--line);padding:20px}
.diagram svg{width:100%;height:auto;display:block}
.dg-ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dg-ctrl button{height:34px;padding-inline:12px;border:1px solid var(--line);background:var(--card);font-size:13.5px;border-radius:2px}
.dg-ctrl button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dg-cap{margin-top:12px;font-size:14.5px;color:var(--ink);min-height:2.8em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.numlist{display:grid;gap:10px;counter-reset:nl}
.numlist li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);counter-increment:nl}
.numlist li::before{content:counter(nl);width:30px;height:30px;border-radius:50%;background:var(--ac-btn);color:var(--ac-ink);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600}
.numlist b{display:block;font-size:15.5px}
.numlist span{font-size:13.5px;color:var(--muted)}
.thd{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thd div{flex:1 1 140px;padding:12px 14px;background:var(--card);border:1px solid var(--line)}
.thd span{display:block;font-size:12.5px;color:var(--muted)}
.thd b{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.thd .after b{color:var(--ac)}

/* svgs */
.flisr{--live:var(--sw-on);--dead:var(--faint);--opn:var(--open);--nfg:#fff;--txt:var(--muted);--bgc:var(--panel);--fault:var(--warn)}
.on-dark .flisr{--live:#FF4D61;--dead:#5E6672;--opn:#34C46A;--txt:var(--hero-muted);--bgc:var(--hero-2);--fault:#F0A928}
.flisr .seg{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke .35s}
.flisr .seg.live{stroke:var(--live)}
.flisr .seg.dead{stroke:var(--dead);stroke-dasharray:5 6;stroke-width:3}
.flisr .nd circle,.flisr .nd rect{stroke-width:2.5;transition:fill .35s,stroke .35s}
.flisr .nd.cl circle,.flisr .nd.cl rect{fill:var(--live);stroke:var(--live)}
.flisr .nd.op circle,.flisr .nd.op rect{fill:var(--bgc);stroke:var(--opn)}
.flisr .nd text{font-family:var(--mono);font-size:10px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.flisr .nd.cl text{fill:var(--nfg)}
.flisr .nd.op text{fill:var(--opn)}
.flisr .src rect{fill:var(--bgc);stroke:var(--txt);stroke-width:1.5}
.flisr .lbl{font-family:var(--mono);font-size:10.5px;fill:var(--txt);text-anchor:middle}
.flisr .fault{opacity:0;transition:opacity .3s}
.flisr .fault.show{opacity:1}
.flisr .fault path{fill:var(--fault)}
.flisr .ring-lbl{font-family:var(--mono);font-size:10px;fill:var(--txt);text-anchor:middle}
.wv{--a:var(--ink);--b:var(--faint);--c:var(--ac);--g:var(--line);--t:var(--muted);--sh:var(--ac-soft)}
.on-dark .wv{--a:#F4F4F5;--b:#6A7280;--c:var(--ac-hl);--g:var(--hero-line);--t:var(--hero-muted);--sh:color-mix(in srgb,var(--ac-hl) 16%,transparent)}
.wv .grid{stroke:var(--g);stroke-width:1}
.wv .ax{font-family:var(--mono);font-size:10.5px;fill:var(--t)}
.wv .tr{fill:none;stroke-width:2.2;stroke-linejoin:round}
.wv .tr.a{stroke:var(--a)} .wv .tr.b{stroke:var(--b)} .wv .tr.c{stroke:var(--c)}
.wv .shade{fill:var(--sh)}
.wv .mk{stroke:var(--t);stroke-width:1;stroke-dasharray:3 3}
.wv .ann{font-family:var(--font);font-size:11.5px;fill:var(--t)}
.wv .ann.c{fill:var(--c);font-weight:600}
.wv .tr{transition:opacity .35s,stroke-width .35s}
.wv .dim{opacity:.22}
.mcc{--box:var(--card);--ln:var(--faint);--t:var(--muted);--okc:var(--ok);--wrc:var(--warn);--k:var(--ink)}
.mcc rect.m{fill:var(--box);stroke:var(--ln);stroke-width:1.2}
.mcc rect.e{fill:var(--k)}
.mcc text{font-family:var(--mono);font-size:10px;fill:var(--t);text-anchor:middle;dominant-baseline:central}
.mcc text.ek{fill:var(--bg);font-size:10.5px;font-weight:600}
.mcc path{stroke:var(--ln);stroke-width:1.2;fill:none}
.mcc circle.ok{fill:var(--okc)} .mcc circle.wr{fill:var(--wrc)}

/* resources */
.rlist{border-top:2px solid var(--ink)}
.ri{display:grid;grid-template-columns:110px minmax(0,1fr) 150px 120px auto;gap:16px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.ri .rt b{font-weight:600;font-size:15.5px;display:block}
.ri .rt span{font-size:13px;color:var(--muted)}
.ri .rm{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.ri .ra{display:flex;gap:6px;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.badge.lock{color:var(--warn)}

/* contact */
.ct-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;align-items:start}
.form{display:grid;gap:22px;background:var(--card);border:1px solid var(--line);padding:28px}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.fld .lb{font-size:14px;font-weight:600;color:var(--title)}
.fld label i,.fld .lb i{color:var(--err);font-style:normal;margin-left:2px}
.fld input,.fld select,.fld textarea{width:100%;height:46px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:15px;border-radius:2px}
.fld textarea{height:160px;padding:12px;resize:vertical;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--ink)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--err)}
.fld .em{font-size:12.5px;color:var(--err);min-height:0}
.fld .hint{font-size:12.5px;color:var(--faint)}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;width:1px;height:1px}
.radios span{display:inline-flex;align-items:center;height:38px;padding-inline:14px;border:1px solid var(--line);font-size:14px;font-weight:500;cursor:pointer;border-radius:2px;background:var(--bg)}
.radios input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.radios input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.file{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file .fname{font-size:13.5px;color:var(--muted)}
.consent{border:1px solid var(--line);background:var(--panel);padding:14px 16px;display:grid;gap:10px;font-size:13.5px}
.consent .ctext{color:var(--muted);line-height:1.7}
.consent label{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer;font-size:14.5px}
.consent input{width:18px;height:18px;accent-color:var(--ac)}
.fact-side{display:grid;gap:16px;position:sticky;top:calc(var(--hdr) + 24px + env(safe-area-inset-top,0px))}
.side-card{background:var(--card);border:1px solid var(--line);padding:22px;display:grid;gap:12px}
.side-card.k{background:var(--hero);color:var(--hero-fg);border-color:var(--hero)}
.side-card h4{font-size:16px}
.kv{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14.5px}
.kv span{color:var(--muted);font-size:13px}
.side-card.k .kv span{color:var(--hero-muted)}
.kv b{font-family:var(--mono);font-weight:500}
.cp{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:inherit;opacity:.7}
.cp:hover{opacity:1;background:rgba(127,127,127,.15)}
.cp .ic svg{width:15px;height:15px}
.receipt{background:var(--card);border:1px solid var(--line);display:grid}
.rc-h{padding:24px 28px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.rc-h .no{font-family:var(--mono);font-size:14px;color:var(--ac)}
.rc-b{padding:22px 28px;display:grid;gap:18px}
.mailprev{border:1px solid var(--line);background:var(--panel);font-size:14px}
.mailprev .mh{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mailprev .mh span{color:var(--muted)}
.mailprev pre{margin:0;padding:14px 16px;font-family:var(--font);white-space:pre-wrap;color:var(--ink);font-size:14px;line-height:1.7}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.bu{border-top:3px solid var(--bc);background:var(--card);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.bu h3{padding:18px 20px;font-size:17px;border-bottom:1px solid var(--line);color:var(--title);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:15px 20px;border-bottom:1px solid var(--line);align-items:center}
.person:last-child{border-bottom:0}
.person b{font-size:16px}
.person .role{font-size:13px;color:var(--muted);grid-column:1}
.person .pm{grid-column:2;grid-row:1/span 2;display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.map-ph{border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;text-align:center;padding:40px 20px;gap:12px;min-height:280px}
.map-ph .ic{width:56px;height:56px;border-radius:50%;background:var(--ac-btn);color:var(--ac-ink);align-items:center;justify-content:center}

/* board */
.btbl td.c,.btbl th.c{text-align:center}
.btbl td.t a{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.btbl td.t a:hover{color:var(--ac)}
.btbl tr.pin td{background:var(--panel)}
.btbl .nb{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:22px;padding-inline:6px;font-size:11.5px;font-weight:700;background:var(--ac-btn);color:var(--ac-ink);border-radius:2px}
.btbl .cat{font-size:13px;color:var(--muted)}
.ans{display:inline-flex;font-size:11.5px;font-weight:600;color:var(--ok);border:1px solid var(--ok);padding:0 6px;border-radius:2px}
.ans.wait{color:var(--faint);border-color:var(--faint)}
.pager{display:flex;justify-content:center;gap:4px;margin-top:6px}
.pager button{width:36px;height:36px;border:1px solid var(--line);font-family:var(--mono);font-size:13px;background:var(--card)}
.pager button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.post{border-top:2px solid var(--ink)}
.post-h{padding:22px 4px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.post-h h2{font-size:24px;color:var(--ink)}
.post-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.post-b{padding:28px 4px 36px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.85;white-space:pre-line;max-width:72ch}
.post-a{margin-top:18px;background:var(--panel);border-left:4px solid var(--ac);padding:18px 20px;white-space:pre-line;font-size:15.5px;line-height:1.8}
.post-a b{display:block;color:var(--ac);margin-bottom:6px}
.post-nav{display:grid;border-bottom:1px solid var(--line)}
.post-nav a{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;padding:14px 4px;border-top:1px solid var(--line);font-size:14.5px}
.post-nav a span{color:var(--muted)}
.post-nav a:hover b{color:var(--ac)}
.post-act{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* modal, search, toast, dock */
.modal{position:fixed;inset:0;z-index:100;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{position:relative;background:var(--bg);width:100%;max-width:900px;max-height:calc(100vh - 32px);overflow:auto;border-radius:6px;box-shadow:var(--shadow)}
.mclose{position:absolute;right:12px;top:12px;z-index:2;background:var(--bg)}
.pm-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.pm-img{background:var(--well);position:relative;min-height:340px;overflow:hidden}
.pm-img img{position:absolute;inset:36px;width:calc(100% - 72px);height:calc(100% - 72px);object-fit:contain}
.pm-img .plate{position:absolute;inset:0}
.pm-b{padding:36px 32px 28px;display:grid;gap:14px;align-content:start}
.pm-b h3{font-size:24px;line-height:1.35}
.pm-b ul li{position:relative;padding-left:14px;margin-bottom:6px;color:var(--muted);font-size:15px}
.pm-b ul li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;background:var(--ac)}
.pm-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mpad{padding:36px 32px}
.mpad h3{font-size:22px;margin-bottom:16px;color:var(--title)}
.mpad .prose{font-size:14.5px}
.smap{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px}
.smap h4{font-size:15px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.smap a{display:block;padding:5px 0;font-size:14px;color:var(--muted)}
.smap a:hover{color:var(--ac)}
.srch{position:fixed;inset:0;z-index:95;background:var(--scrim);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.srch-box{max-width:760px;margin:6vh auto 0;background:var(--bg);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.srch-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:64px;border-bottom:1px solid var(--line)}
.srch-in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:18px;height:100%}
.srch-res{max-height:60vh;overflow:auto;padding:8px 0 12px}
.srch-res h5{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--faint);padding:12px 18px 4px;font-weight:500;text-transform:uppercase}
.srch-res a{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;font-size:15px}
.srch-res a span{color:var(--muted);font-size:13px;white-space:nowrap}
.srch-res a:hover,.srch-res a:focus{background:var(--panel);outline:0}
.srch-res mark{background:var(--ac-soft);color:var(--ac);padding:0 1px}
.srch-tip{padding:16px 18px;color:var(--muted);font-size:14px}
.srch-tip button{color:var(--ac);margin-right:10px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:4px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.dock{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;justify-items:end;gap:10px}
.dock-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding-inline:16px;border-radius:22px;background:#1B1B1E;color:#fff;font-weight:600;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.3);border:1px solid #38383D}
.dock-btn i{width:8px;height:8px;border-radius:50%;background:var(--ac-hl)}
.top-btn{width:44px;height:44px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-family:var(--mono);font-size:11px;font-weight:600}
.dock-panel{width:340px;max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.dp-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dp-h b{font-size:15px}
.dp-h span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dp-s{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.dp-s>label,.dp-s .lb{font-size:12.5px;font-weight:600;color:var(--muted)}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.segc button{height:34px;font-size:13px;border-right:1px solid var(--line)}
.segc button:last-child{border-right:0}
.segc button.on{background:var(--ink);color:var(--bg)}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.sw input{width:40px;height:22px;accent-color:var(--ac)}
.notes{display:grid;gap:6px}
.notes textarea{width:100%;height:70px;border:1px solid var(--line);background:var(--bg);padding:8px 10px;font-size:13.5px;resize:vertical;border-radius:3px}
.notes .nl{display:grid;gap:4px;max-height:160px;overflow:auto}
.notes .ni{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;font-size:13px;padding:6px 8px;background:var(--panel);border-radius:3px}
.notes .ni span{color:var(--muted);font-family:var(--mono);font-size:11px;display:block}
.notes .row{display:flex;gap:6px;justify-content:space-between}
.dp-f{padding:12px 16px;font-size:12px;color:var(--muted);line-height:1.6}
.tones{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tone-b{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:4px;font-size:12.5px;text-align:left;line-height:1.3;background:var(--bg)}
.tone-b:hover{border-color:var(--faint)}
.tone-b.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tone-b em,.tc-b em{font-style:normal;color:var(--ac);font-weight:600;font-size:11.5px}
.tsw{position:relative;flex:none;width:28px;height:28px;border-radius:4px}
.tsw i{position:absolute;right:4px;bottom:4px;width:10px;height:10px;border-radius:50%}
.mbox.wide{max-width:1320px}
.tc-note{font-size:13.5px;color:var(--muted);margin:-6px 0 18px}
.tcmp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tc{border:1px solid var(--line);display:grid;grid-template-rows:auto auto 1fr;background:var(--card);min-width:0}
.tc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tc-hero{padding:18px 16px 20px;display:grid;gap:8px;justify-items:start;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px}
.tc-hero img{height:24px;width:auto;margin-bottom:6px}
.tc-hero .eb{font-family:var(--mono);font-size:10px;letter-spacing:.12em}
.tc-hero b{color:#F4F6F8;font-size:17px;line-height:1.35}
.tc-hero .tb{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:2px;margin-top:4px}
.tc-light{background:#FFFFFF;padding:14px 16px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.tc-light .bar{width:26px;height:3px}
.tc-light b{font-size:15px}
.tc-light span{font-size:12.5px;font-weight:600}
.tc-b{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.tc-b h4{font-size:16px}
.tc-b p{font-size:13px;color:var(--muted);line-height:1.6}
.tc-sw{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.tc-sw span{display:flex;align-items:center;gap:6px}
.tc-sw i{width:14px;height:14px;border-radius:3px;outline:1px solid var(--line)}
.tc-sw code{font-family:var(--mono);margin-left:auto;color:var(--ink)}
@media (max-width:1000px){.tcmp{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tcmp{grid-template-columns:1fr}}

/* pictograms + isometric scenes */
.pg{display:inline-flex;flex:none;color:var(--ink)}
.pg svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pg .a{stroke:var(--ac)} .pg .f{fill:currentColor;stroke:none} .pg .fa{fill:var(--ac);stroke:none}
.pg.sm svg{width:30px;height:30px} .pg.md svg{width:40px;height:40px} .pg.lg svg{width:60px;height:60px}
.pg.on-dark{color:#E6EEF5} .pg.on-dark .a{stroke:var(--ac-hl)} .pg.on-dark .fa{fill:var(--ac-hl)}
.iso{width:100%;height:auto;display:block}
.iso .pgi{fill:none;stroke:#13253A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iso .pgi .a{stroke:#007A85}.iso .pgi .f{fill:#13253A;stroke:none}.iso .pgi .fa{fill:#007A85;stroke:none}
@keyframes isoflow{to{stroke-dashoffset:-32}}

/* ---------- iso kit ---------- */
const f1=n=>(+n).toFixed(1);
const MAT={

function kit(K,OX,OY){
 const ip=(x,y,z=0)=>[OX+(x-y)*0.8660254*K,OY+(x+y)*0.5*K-z*K];
 const P=a=>a.map(p=>f1(p[0])+','+f1(p[1])).join(' ');
 const D=a=>'M'+a.map(p=>f1(p[0])+' '+f1(p[1])).join('L');
 const poly=(pts,fill,ex='')=>`<polygon points="${P(pts)}" fill="${fill}" ${ex}/>`;
 const ST='stroke="rgba(40,60,80,.18)" stroke-width=".6" stroke-linejoin="round"';
 const box=(x,y,z,w,d,h,m,st=ST)=>{const Q=(a,b,c)=>ip(x+a*w,y+b*d,z+c*h);
  return poly([Q(0,1,0),Q(1,1,0),Q(1,1,1),Q(0,1,1)],m.l,st)+poly([Q(1,0,0),Q(1,1,0),Q(1,1,1),Q(1,0,1)],m.r,st)+poly([Q(0,0,1),Q(1,0,1),Q(1,1,1),Q(0,1,1)],m.t,st)};
 const qY=(xa,xb,za,zb,y)=>[ip(xa,y,za),ip(xb,y,za),ip(xb,y,zb),ip(xa,y,zb)];
 const qX=(ya,yb,za,zb,x)=>[ip(x,ya,za),ip(x,yb,za),ip(x,yb,zb),ip(x,ya,zb)];
 const hull=ps=>{ps=ps.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const p of ps){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(const p of ps.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  return lo.slice(0,-1).concat(up.slice(0,-1))};
 const shadow=(x,y,w,d,h,o=.2)=>{const lx=.62*h,ly=.18*h,c=[[x,y],[x+w,y],[x+w,y+d],[x,y+d]];
  return `<polygon points="${P(hull(c.map(q=>ip(q[0],q[1])).concat(c.map(q=>ip(q[0]+lx,q[1]+ly)))))}" fill="rgba(18,38,58,${o})" filter="url(#iso-blur)"/>`};
 const seg=(pts,z=.02)=>pts.map(q=>ip(q[0],q[1],q[2]??z));
 const trench=pts=>{const p=seg(pts);return `<path d="${D(p)}" fill="none" stroke="#D3DCE4" stroke-width="${f1(K*.9)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${D(p)}" fill="none" stroke="#8C99A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>`};
 const flow=(pts,dir=1,col='#00B7C3',z=.04)=>{const p=seg(dir>0?pts:pts.slice().reverse(),z);const d=D(p);
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".28" filter="url(#iso-glow)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#F2FEFF" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round" class="flow"/>`};

 const chip=(text,x,y,z,o={})=>{const p=ip(x,y,z);const w=o.w||(text.length*6.6+(o.dot?24:16));const dot=o.dot?`<circle cx="${f1(-w/2+10)}" cy="0" r="3.6" class="cd" fill="#E5484D"/>`:'';
  return `<g class="chip${o.cls?' '+o.cls:''}"${o.n?` data-n="${o.n}"`:''} transform="translate(${f1(p[0])},${f1(p[1])})${o.s?` scale(${o.s})`:''}"><rect x="${f1(-w/2)}" y="-10" width="${f1(w)}" height="20" rx="10" fill="${o.bg||'#FFFFFF'}" stroke="rgba(19,37,58,.16)" filter="url(#iso-drop)"/>${dot}<text x="${o.dot?f1(-w/2+17):0}" y="3.8" ${o.dot?'':'text-anchor="middle"'} font-size="10.5" font-weight="600" fill="${o.fg||'#13253A'}" font-family="IBM Plex Mono,ui-monospace,monospace">${text}</text></g>`};

  return `<g class="badge" transform="translate(${f1(p[0])},${f1(p[1])})"><path d="M0 ${r+9}V${r}" stroke="#13253A" stroke-width="1" opacity=".35"/><circle r="${r}" fill="#FFFFFF" filter="url(#iso-drop)"/><svg x="${f1(-s/2)}" y="${f1(-s/2)}" width="${f1(s)}" height="${f1(s)}" viewBox="0 0 48 48" class="pgi">${PG[name]}</svg></g>`};
 const platform=(X1,Y1,TH=1.4,grid=4)=>{let s=poly([ip(0,Y1,0),ip(X1,Y1,0),ip(X1,Y1,-TH),ip(0,Y1,-TH)],'#C7D1DA')+poly([ip(X1,0,0),ip(X1,Y1,0),ip(X1,Y1,-TH),ip(X1,0,-TH)],'#B1BEC9')+poly([ip(0,0),ip(X1,0),ip(X1,Y1),ip(0,Y1)],'url(#iso-plat)');
  for(let i=grid;i<X1;i+=grid)s+=`<path d="${D([ip(i,0),ip(i,Y1)])}" stroke="#C9D4DD" stroke-width=".5" opacity=".6"/>`;
  for(let j=grid;j<Y1;j+=grid)s+=`<path d="${D([ip(0,j),ip(X1,j)])}" stroke="#C9D4DD" stroke-width=".5" opacity=".6"/>`;
  return `<ellipse cx="${f1(ip(X1/2,Y1/2)[0])}" cy="${f1(ip(X1/2,Y1/2)[1]+K*2)}" rx="${f1((X1+Y1)*.5*K)}" ry="${f1((X1+Y1)*.2*K)}" fill="rgba(10,25,40,.18)" filter="url(#iso-blur8)"/>`+s};
 const patch=(x0,y0,x1,y1,fill)=>poly([ip(x0,y0,.01),ip(x1,y0,.01),ip(x1,y1,.01),ip(x0,y1,.01)],fill);
 const tree=(x,y,s=1)=>{const b=ip(x,y,0),c=ip(x,y,2.4*s);return `<ellipse cx="${f1(b[0]+8*s)}" cy="${f1(b[1]+2)}" rx="${f1(14*s)}" ry="${f1(6*s)}" fill="rgba(18,38,58,.16)" filter="url(#iso-blur)"/><path d="M${f1(b[0])} ${f1(b[1])}V${f1(c[1]+4)}" stroke="#7A6A58" stroke-width="2.4"/><circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(13*s)}" fill="url(#iso-tree)"/><circle cx="${f1(c[0]+5*s)}" cy="${f1(c[1]-6*s)}" r="${f1(8*s)}" fill="url(#iso-tree)" opacity=".9"/>`};
 const kiosk=(id,x,y,o={})=>{const w=o.w||3.2,d=o.d||2.6,h=o.h||3.3,x0=x-w/2,y0=y-d/2,z1=.35,zt=z1+h,yF=y0+d,xF=x0+w;
  let s=shadow(x0,y0,w,d,zt)+box(x0-.18,y0-.18,0,w+.36,d+.36,z1,MAT.plinth)+box(x0,y0,z1,w,d,h,MAT.cab);

  s+=poly(qY(x0+.3,x0+1.35,zt-1.25,zt-.5,yF),'#1C2C3B')+`<g class="kscr" data-n="${id}">${poly(qY(x0+.42,x0+1.23,zt-1.13,zt-.62,yF),'#2DD4DF','opacity=".85"')}</g>`;

  for(let i=0;i<4;i++)s+=`<path d="${D([ip(xF,y0+.4,z1+.6+i*.3),ip(xF,y0+2.1,z1+.6+i*.3)])}" stroke="rgba(40,60,80,.28)" stroke-width=".8"/>`;

function wavePath(fn,x0,x1,t0,t1,yc,amp,step){
 let d='';const n=Math.round((t1-t0)/step);
 for(let i=0;i<=n;i++){const t=t0+i*step,x=x0+(t-t0)/(t1-t0)*(x1-x0),y=yc-amp*fn(t);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
 return d;
}
function hsbtSVG(){

 const pre=t=>Math.sin(w*t), res=t=>0.82*Math.exp(-(t-20)/28)*Math.sin(2*Math.PI*57/1000*(t-20)+w*20), post=t=>Math.sin(w*t+0.45);

  <rect class="shade" x="${x(20)}" y="30" width="${x(50)-x(20)}" height="148"/>
  <line class="mk" x1="${x(20)}" y1="22" x2="${x(20)}" y2="178"/><line class="mk" x1="${x(50)}" y1="22" x2="${x(50)}" y2="178"/>
  <path class="tr a" d="${wavePath(pre,X0,x(20),0,20,yc,amp,.25)}"/>
  <path class="tr b" d="${wavePath(res,x(20),x(50),20,50,yc,amp,.25)}"/>
  <path class="tr c" d="${wavePath(post,x(50),X1,50,100,yc,amp,.25)}"/>
  <text class="ann" x="${x(20)-4}" y="18" text-anchor="end">Main source fault</text>

  <text class="ann" x="${x(50)+4}" y="18">Standby source closed</text>
  <text class="ax" x="${X1}" y="208" text-anchor="end">Time [ms] · concept</text>
  <text class="ax" x="${X0}" y="208">Bus voltage (example)</text>
 </svg>`;
}

 if(link){const h=link.getAttribute('href'),cur=location.hash||'#home';if(h===cur||(h==='#home'&&cur==='#')){e.preventDefault();closeMega();const d=$('#drawer');if(d&&!d.hidden){d.hidden=true;const bg=$('[data-act="burger"]');if(bg){bg.setAttribute('aria-expanded','false');bg.innerHTML=ic('menu')}}window.scrollTo({top:0,behavior:RM?'auto':'smooth'})}}
 if(!a){if(link&&!$('#modal').hidden)closeModal();if(link&&!$('#srch').hidden)closeSearch();return}
 const act=a.dataset.act,k=a.dataset.k;
 switch(act){
  case 'theme':setTheme(curTheme()==='dark'?'light':'dark');break;
  case 'settheme':setTheme(k);break;
  case 'kor':location.href='../'+location.hash;break;
  case 'search':openSearch();break;
  case 'closesearch':closeSearch();break;
  case 'sq':{const i=$('#sq');i.value=a.dataset.v;i.dispatchEvent(new Event('input'));i.focus();break}
  case 'sgo':{const pid=a.dataset.prod;closeSearch();if(pid){setTimeout(()=>prodModal(pid),60)}break}
  case 'burger':{const d=$('#drawer');d.hidden=!d.hidden;a.setAttribute('aria-expanded',String(!d.hidden));a.innerHTML=ic(d.hidden?'menu':'close');break}
  case 'slide':showSlide(+a.dataset.slide);break;
  case 'prev':showSlide((slideI-1+SLIDES.length)%SLIDES.length);break;
  case 'next':showSlide((slideI+1)%SLIDES.length);break;
  case 'pause':paused=!paused;a.innerHTML=paused?ic('play'):ic('pause');a.setAttribute('aria-label',paused?'Resume autoplay':'Pause autoplay');$('#hcBars').classList.toggle('paused',paused);if(!paused)showSlide(slideI);break;
  case 'prod':prodModal(a.dataset.id);break;
  case 'quote':case 'reqp':{const p=PRODUCTS.find(x=>x.id===a.dataset.id);prefill={type:act==='quote'?'Quotation':'Document request',brand:p.brand,prod:p.model,sub:`${p.name} (${p.model}) ${act==='quote'?'Quotation':'Document request'}`};receipt=null;closeModal();if(curId==='contact')render();else location.hash='#contact';break}
  case 'req':{const r=RESOURCES.find(x=>x.id===a.dataset.id);prefill={type:'Document request',brand:r.brand||'',sub:`Document request: ${r.title}`,msg:`The following document is requested.\n- ${r.title}\n\nPurpose of use: `};receipt=null;if(curId==='contact')render();else location.hash='#contact';break}
  case 'dl':toast('Downloads do not work in this draft. PDF files will be linked on the live site.');break;
  case 'img':openModal(`<div class="mpad"><h3>${esc(a.dataset.t)}</h3><div style="background:var(--well);padding:16px;display:grid;place-items:center"><img src="${A(a.dataset.img)}" alt="${esc(a.dataset.t)}" style="max-height:70vh;width:auto;max-width:100%"></div></div>`,a.dataset.t);break;
  case 'closemodal':closeModal();break;
  case 'copy':copy(a.dataset.v);break;
  case 'reftab':refTab=k;$$('.tabs [data-act="reftab"]').forEach(b=>{b.classList.toggle('on',b.dataset.k===k);b.setAttribute('aria-selected',b.dataset.k===k)});$('#refBody').innerHTML=refTable(k);break;
  case 'pfb':pf.brand=k;pf.cat='all';refreshProducts();break;
  case 'pfc':pf.cat=k;refreshProducts();break;
  case 'fl':{flStop();const s=$('#flSol svg');ISO.setFLISR(s,+k);$$('.dg-ctrl [data-act="fl"]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#flCap').textContent=ISO.FL.cap[+k];break}
  case 'hs':{const s=$('#hsSol svg');ISO.setHSBT(s,+k);$$('.dg-ctrl [data-act="hs"]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#hsCap').textContent=ISO.HS.cap[+k];break}
  case 'pqs':{const s=$('#pqSol svg');ISO.setPQ(s,+k);$$('.dg-ctrl [data-act="pqs"]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#pqCap').textContent=PQCAP[+k];break}
  case 'flplay':{if(flTimer){flStop();break}let i=0;const step=()=>{const s=$('#flSol svg');if(!s){flStop();return}ISO.setFLISR(s,i);$$('.dg-ctrl [data-act="fl"]').forEach(b=>b.classList.toggle('on',+b.dataset.k===i));$('#flCap').textContent=ISO.FL.cap[i];i=(i+1)%4};step();flTimer=setInterval(step,2000);timers.push(flTimer);a.innerHTML=`${ic('pause','sm')} Pause`;break}
  case 'pq':pqMode=k;$('#pqWave').innerHTML=pqSVG(k);$$('.dg-ctrl [data-act="pq"]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));break;
  case 'sample':{const f=$('#cform');const v={co:'(Sample) Hanbit Plant',dept:'Manager, Electrical Team',name:'Gildong Hong',tel:'010-1234-5678',mail:'sample@example.com',sub:f.elements.sub.value||'EOCR quotation for new MCC',msg:f.elements.msg.value||'We request an EOCR quotation for a new MCC.\n- 42 motors (load list to follow)\n- Communication: Modbus\n- Delivery: March 2027'};Object.entries(v).forEach(([n,x])=>{f.elements[n].value=x;setErr(f,n,'')});$('#f-agree').checked=true;$('#agreeErr').textContent='';$('#msgCount').textContent=f.elements.msg.value.length;toast('Sample filled in. Click Submit to try it.');break}
  case 'newinq':receipt=null;render();break;
  case 'wcat':wcat=k;break;
  case 'bpage':bpage=+k;render(false);break;
  case 'delpost':{userPosts=userPosts.filter(p=>p.id!==+a.dataset.id);store.set('posts',userPosts);toast('Deleted.');location.hash='#board-qna';break}
  case 'privacy':openModal(`<div class="mpad"><h3>Privacy policy <span class="draft">Draft</span></h3><div class="prose"><p>SCAB Engineering Co., Ltd. collects the minimum personal information needed to respond to customer inquiries.</p><p><b>Items collected</b> company, name, phone, e-mail<br><b>Purpose</b> responding to inquiries, providing quotations and technical documents<br><b>Retention</b> 1 year after the inquiry is closed, or longer if required by law</p><p><b>Privacy officer</b> to be designated</p><p class="note">To be replaced with the final version before the official launch.</p></div></div>`,'Privacy policy');break;
  case 'noemail':openModal(`<div class="mpad"><h3>No unauthorized e-mail collection</h3><div class="prose"><p>We refuse the unauthorized collection of e-mail addresses posted on this website by e-mail harvesting programs or other technical means.</p><p>Violations may be punished under the Act on Promotion of Information and Communications Network Utilization and Information Protection.</p></div></div>`,'No unauthorized e-mail collection');break;
  case 'sitemap':sitemapModal();break;
  case 'settone2':setTone(k);break;
  case 'tonecmp':toneModal();break;
  case 'dock':if(!toolsOk){openLock();break}dockOpen=!dockOpen;dockRender();break;
  case 'locktools':store.set('tools_ok','');toolsOk=false;dockOpen=false;if(admin){admin=false;store.set('admin',false);render(false)}dockRender();toast('Review tools locked.');break;
  case 'width':width=k;store.set('width',k);applyWidth();dockRender();window.scrollTo({top:0});break;
  case 'top':window.scrollTo({top:0,behavior:RM?'auto':'smooth'});break;
  case 'addnote':{const t=$('#noteIn').value.trim();if(!t){$('#noteIn').focus();return}notes.unshift({page:curId==='home'?'Home':(TITLE[curId]||curId),text:t});store.set('notes',notes);dockRender();toast('Note added.');break}
  case 'delnote':notes.splice(+k,1);store.set('notes',notes);dockRender();break;
  case 'copynotes':copy(`[Homepage draft ${VERSION} revision notes]\n`+notes.slice().reverse().map((n,i)=>`${i+1}. (${n.page}) ${n.text}`).join('\n'));break;
 }
});
let flTimer=null;
function flStop(){if(flTimer){clearInterval(flTimer);flTimer=null}const b=$('#flPlay');if(b)b.innerHTML=`${ic('play','sm')} Autoplay`}
document.addEventListener('input',e=>{
 if(e.target.id==='pq'){pf.q=e.target.value;const g=$('#pgrid');if(g){g.innerHTML=prodGridHTML();updCount()}}
 if(e.target.id==='rq'){rq=e.target.value;const cat=curId==='resources'?'all':curId.replace('resources-','');const list=RESOURCES.filter(r=>(cat==='all'||r.cat===cat)&&(!rq||r.title.toLowerCase().includes(rq.toLowerCase())));$('#rlist').innerHTML=list.length?list.map(resRow).join(''):'<div class="empty">No results found.</div>'}
 if(e.target.id==='bq'){bq=e.target.value;bpage=1;const pos=e.target.selectionStart;render(false);const n=$('#bq');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener('change',e=>{if(e.target.id==='fam'&&e.target.value){const a=document.createElement('a');a.href=e.target.value;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();e.target.value=''}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(!$('#srch').hidden)closeSearch();else closeMega()}
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openSearch()}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#srch').addEventListener('click',e=>{if(e.target.id==='srch')closeSearch()});

/* mega hover */
function bindMega(){
 const hdr=$('#hdr');
 $$('.gnb li').forEach(li=>{li.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')openMega(li.dataset.menu)});li.querySelector('a').addEventListener('focus',()=>openMega(li.dataset.menu))});
 hdr.addEventListener('pointerleave',()=>{megaT=setTimeout(closeMega,160)});
 hdr.addEventListener('pointerenter',()=>clearTimeout(megaT));
 hdr.addEventListener('focusout',e=>{if(!hdr.contains(e.relatedTarget))closeMega()});
}

/* boot */
const th0=store.get('theme','system');if(th0!=='system')document.documentElement.setAttribute('data-theme',th0);
shell();bindMega();applyWidth();dockRender();
window.addEventListener('hashchange',()=>render(true));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',themeLabel);
render(false);
})();
</script>
